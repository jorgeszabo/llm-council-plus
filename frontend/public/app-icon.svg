  <circle cx="256" cy="128" r="30" fill="#fbbf24"/>
  <circle cx="384" cy="256" r="28" fill="#22d3ee"/>
  <circle cx="256" cy="384" r="30" fill="#60a5fa"/>
  <circle cx="128" cy="256" r="28" fill="#38bdf8"/>
  <path d="M256 198v116M198 256h116" stroke="#f8fafc" stroke-width="28" stroke-linecap="round"/>
