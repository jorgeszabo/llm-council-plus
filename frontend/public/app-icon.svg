<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LLM Council Plus</title>
  <desc id="desc">A blue and gold council table icon.</desc>
  <defs>
