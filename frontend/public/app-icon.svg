      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="48%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#060a12"/>
    </radialGradient>
    <linearGradient id="ring" x1="84" y1="96" x2="432" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
